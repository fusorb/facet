name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:docs
      - run: pnpm check:icons
      - run: pnpm check:components
      - run: pnpm check:sdk-drift
      - run: pnpm check:motion-drift
      - run: pnpm -r typecheck
      - run: pnpm test
      - run: pnpm sandbox:e2e

  # Auto-open the "Version Packages" PR when changesets land on main.
  # This only VERSIONS (bumps versions + CHANGELOGs) and opens a PR; it does
  # NOT publish to npm itself. Publishing is automated in the `publish` job
  # below, which runs only after that version PR merges to main.
  #
  # Requires `contents: write` to push the changeset-release/main branch,
  # `pull-requests: write` to open/update the version PR, and `issues: write`
  # for the action to post a comment on that PR (PR comments are issue comments
  # in the GitHub GraphQL API). All three were needed - the old job lacked
  # `issues: write`, causing "Resource not accessible by integration" on PR
  # comment creation.
  #
  # changesets/action v2 requires the `github-token` input explicitly and uses
  # the GitHub API to push the release branch, so it needs `contents: write`.
  changeset:
    name: Version Packages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-title: "chore(release): version packages"
          commit-message: "chore(release): version packages"
          # Version only: bumps package.json + CHANGELOG and opens a PR.
          # npm publish happens in the `publish` job after that PR merges.
          version-script: pnpm changeset version

  # After the "Version Packages" PR merges to main, this job publishes the
  # versioned packages to npm. It gates on the `ci` job (typecheck + build must
  # pass) and rebuilds `dist` from scratch before publishing, so a stale or
  # dirty tree is never shipped -- the same clean-tree guardrail the local
  # `pnpm release` flow enforces.
  #
  # `changesets/action` in publish mode self-detects: if the versions in main
  # already match what's on npm it is a no-op; if the merged version PR bumped
  # versions beyond npm, it runs `pnpm changeset publish`.
  #
  # npm auth: changesets/action v2 no longer reads NPM_TOKEN. Auth is wired by
  # `actions/setup-node` (registry-url + auth-token), which writes the token
  # into the temp .npmrc as ${NODE_AUTH_TOKEN}; pnpm resolves it from the
  # NODE_AUTH_TOKEN env var below. `id-token: write` is granted so the publish
  # can move to npm Trusted Publishing (OIDC) without a workflow change once
  # the package is configured for it.
  publish:
    name: Publish to npm
    needs: [ci]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
          auth-token: ${{ secrets.NPM_TOKEN }}
      - run: pnpm install --frozen-lockfile
      # Rebuild fresh dist so we never publish a stale build.
      - run: pnpm -r build
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: pnpm changeset publish
          create-github-releases: false
          push-git-tags: false
